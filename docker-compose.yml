version: "3.8"

services:
  postgres:
    image: postgres:17-alpine
    container_name: releaseguard-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-releaseguard}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-releaseguard}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: releaseguard-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-off database migration container
  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: releaseguard-migration
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-releaseguard}
    depends_on:
      postgres:
        condition: service_healthy

  # Core FastAPI Ingestion & Investigation API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: releaseguard-api
    restart: always
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-releaseguard}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-secure-random-secret-key-at-least-32-chars}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost}
      MAX_PAYLOAD_SIZE: 1048576
      MAX_BULK_PAYLOAD_SIZE: 5242880
      MAX_BULK_EVENTS: 100
      AUTH_MAX_ATTEMPTS: 5
      AUTH_LOCKOUT_SECONDS: 900
    ports:
      - "8000:8000"
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Dedicated Asynchronous Redis Streams Ingestion Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: releaseguard-worker
    restart: always
    command: ["python", "-m", "app.worker"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-releaseguard}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # React SPA Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: releaseguard-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
