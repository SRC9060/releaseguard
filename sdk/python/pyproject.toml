[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "releaseguard-sdk"
version = "0.1.0"
description = "Official Python SDK for ReleaseGuard Developer Reliability Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ReleaseGuard Team" }
]
keywords = ["monitoring", "reliability", "errors", "exceptions", "tracing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Bug Tracking",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
